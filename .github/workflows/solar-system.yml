name: solar system workflow
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**
# 🟢 बदल १: आपण गिटहब सिक्रेटमधून थेट पूर्ण कनेक्शन स्ट्रिंग इथे पास करत आहोत
env:
  MONGO_URI: ${{ secrets.MONGO_URI }}

jobs:
  unit-testing:
    name: Unit Testing
    environment:
      name: development
    services:
      mongo-db:
        image: tukaram124/solar-system-db:v1
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          MONGO_INITDB_DATABASE: ${{ vars.DB_NAME }}

    env:
      MONGO_URI: mongodb://${{ vars.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@localhost:27017/${{ vars.DB_NAME }}?authSource=admin
      MONGO_USERNAME: ${{ vars.MONGO_USER }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

    strategy:
      matrix:
        node-version: [18, 20]
        operating-system: [ubuntu-latest] ## macos-latest वरून काढलं आहे कारण node 18 साठी काही एरर्स येत आहेत, आणि node 20 साठी macos वर अजून सपोर्ट नाहीये
        exclude:
          - node-version: 18
            operating-system: macos-latest
    runs-on: ${{ matrix.operating-system }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 💡 टीप: इथे मी setup-node चं व्हर्जन सुद्धा v3 वरून v4 केलं आहे, जेणेकरून एरर्स येणार नाहीत
      - name: Set up Node.js version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Unit Testing
        id: nodejs-unit-testing-step
        run: npm test -- --timeout 15000

      - name: Archive Test Result
        if: always()  # हे सुनिश्चित करेल की टेस्ट फेल झाल्यासही हा स्टेप रन होईल..
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-test-result
          path: test-results.xml
  
  code-coverage:
    name: Code Coverage
    environment:
      name: development
    container:
      image: node:18
    services:
      mongo-db:
        image: tukaram124/solar-system-db:v1
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          MONGO_INITDB_DATABASE: ${{ vars.DB_NAME }}

    env:
      MONGO_URI: mongodb://${{ vars.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@mongo-db:27017/${{ vars.DB_NAME }}?authSource=admin
      MONGO_USERNAME: ${{ vars.MONGO_USER }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     # - name: Set up Node.js Version 18
     #   uses: actions/setup-node@v4
     #   with:
     #     node-version: 18

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."
          sleep 20

      - name: Check code coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive Test Result
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5

  

  docker:
    name: docker-Containerization
    needs: [unit-testing, code-coverage]
    #environment:
     # name: development
    permissions:
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dockerhub Login
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Test DB MongoDB Image
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/solar-system-db:v1 -f ./Dockerfile.mongo .
          docker push ${{ vars.DOCKERHUB_USERNAME }}/solar-system-db:v1

      - name: GHCR Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build for Testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          sleep 3
          export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo "Container IP: $IP"

          echo Testing Image URL using wget
          wget -q -O - 127.0.0.1:3000/live | grep live

      # १. फक्त डॉकर हबसाठी बिल्ड आणि पुश
      - name: Push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      # २. फक्त GHCR साठी बिल्ड आणि पुश (आता हे फेल झालं तरी वरचं काम झालेलं असेल)
      - name: Push to GitHub Packages (GHCR)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/tukaram-k8s/solar-system:${{ github.sha }}

  dev-deployment:
    name: Deploy to Development Environment
    needs: docker
    uses: TUKARAM-k8s/solar_system/.github/workflows/reuse-deployment.yml@main
    secrets: inherit
    with:
      environment: development
      K8s-manifest-dir: 'kubernetes/development'

  prod-deployment:
    name: Deploy to Production Environment
    if: github.ref == 'refs/heads/main'
    needs: dev-deployment
    uses: TUKARAM-k8s/solar_system/.github/workflows/reuse-deployment.yml@main
    secrets: inherit
    with:
      environment: production
      K8s-manifest-dir: 'kubernetes/production'