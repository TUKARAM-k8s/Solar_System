name: Deployment - Reusable Workflow

on:
    workflow_call: 
      inputs:
        kubectl_version:
          description: 'Provide the required kubectl version. Default is v1.26.0'
          default: 'v1.26.0'
          required: false
          type: string
        K8s-manifest-dir:
          description: 'Provide the directory path where the Kubernetes manifest files are located.'
          default: 'kubernetes/development'
          required: true
          type: string
        environment:
          description: 'Provide the deployment environment name (e.g., development, staging, production) for which the deployment is being performed.'
          default: 'development'
          required: true
          type: string
      secrets:
        MONGO_PASSWORD:
          required: true
        DOCKERHUB_PASSWORD:
          required: true

jobs:
    reuse-deployment:
        environment:
            name: ${{ inputs.environment }}
            url: https://${{ steps.set-app-ingress-url.outputs.APP_INGRESS_HOST }}
        outputs:
            APP_INGRESS_URL: ${{ steps.set-app-ingress-url.outputs.APP_INGRESS_HOST }}
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Deploy Application to ${{ inputs.environment }} Environment
          run: |
            echo "Deploying Application to ${{ inputs.environment }} environment..."
            
        - name: Install kubectl CLI
          uses: azure/setup-kubectl@v3
          with:
            version: '${{ inputs.kubectl_version }}'
     # - name: Create Kubernetes Kind Cluster
     #   uses: helm/kind-action@v1
     # we are updating the create k8s kind cluster step to use our custom kind-config.yaml file, which has the necessary port mappings for ingress to work properly
        - name: Create Kubernetes Kind Cluster
          uses: helm/kind-action@v1
          with:
            config: kind-config.yaml

        - name: Install NGINX Ingress Controller
          run: |
            kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
            # इथे आपण थोडा वेळ देतोय की इन्ग्रेस कंट्रोलर पूर्णपणे तयार होईपर्यंत थांबण्यासाठी, कारण कधीकधी तो तयार होण्यासाठी थोडा वेळ घेतो
            echo "Waiting for NGINX Ingress Controller to be ready..."
            kubectl wait --namespace ingress-nginx \
                --for=condition=ready pod \
                --selector=app.kubernetes.io/component=controller \
                --timeout=120s

        - name: Verify Cluster Creation
          run: |
            kubectl version --client=true
            kubectl cluster-info
            kubectl get nodes

        - name: Create Namespace
          run: |
            kubectl create namespace ${{ vars.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
            echo "Namespace created"

        - name: Set INGRESS_IP variable
          run: echo "INGRESS_IP=127.0.0.1" >> $GITHUB_ENV

        - name: Replace Token in Manifest files
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '${'
            tokenSuffix: '}'
            files: '["${{ inputs.K8s-manifest-dir }}/*.yaml"]'
          env:
              NAMESPACE: ${{ vars.NAMESPACE }}
              REPLICAS: ${{ vars.REPLICAS }}
              K8S_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
              INGRESS_IP: ${{ env.INGRESS_IP }}

        - name: Check files
          run: |
            echo "Checking the replaced manifest files..."
            cat ${{ inputs.K8s-manifest-dir }}/*.yaml

        - name: Create MongoDB Secret
          run: |
            kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
                --from-literal=MONGO_URI='mongodb://${{ vars.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@mongo:27017/${{ vars.DB_NAME }}?authSource=admin' \
                --from-literal=MONGO_USERNAME='${{ vars.MONGO_USER }}' \
                --from-literal=MONGO_PASSWORD='${{ secrets.MONGO_PASSWORD }}' \
                --save-config \
                --dry-run=client -o yaml | kubectl apply -f -

        - name: Verify MongoDB Secret
          run: |
            kubectl -n ${{ vars.NAMESPACE }} get secret mongo-db-creds -o jsonpath="{.data.MONGO_USERNAME}" | base64 -d
            echo

        - name: Deploy to ${{ inputs.environment }} Environment
          run: |
            # आधी deployment आणि service अप्लाय करा
            kubectl apply -f ${{ inputs.K8s-manifest-dir }}/deployment.yaml -n ${{ vars.NAMESPACE }}
            kubectl apply -f ${{ inputs.K8s-manifest-dir }}/service.yaml -n ${{ vars.NAMESPACE }}
            
            # थोडा वेळ थांबा
            sleep 10
            
            # शेवटी ingress अप्लाय करा
            kubectl apply -f ${{ inputs.K8s-manifest-dir }}/ingress.yaml -n ${{ vars.NAMESPACE }}

        - name: Verify ${{ inputs.environment }} Deployment
          run: |
            kubectl -n ${{ vars.NAMESPACE }} get all
            kubectl get ingress -n ${{ vars.NAMESPACE }}
            kubectl get secrets -n ${{ vars.NAMESPACE }}

        - name: Verify Environment Values
          run: |
            echo "Environment: ${{ inputs.environment }}"
            echo "DB_NAME=${{ vars.DB_NAME }}"
            echo "MONGO_USER=${{ vars.MONGO_USER }}"

        - name: Set App Ingress Host URL
          id: set-app-ingress-url
          run: |
            echo "APP_INGRESS_HOST=127.0.0.1" >> "$GITHUB_OUTPUT"

        - name: Start Port Forwarding
          run: |
            # १. पॉड रेडी होण्याची वाट पाहा (वेळ १८० सेकंद केलाय)
            kubectl rollout status deployment/solar-system -n ${{ vars.NAMESPACE }} --timeout=90s || (kubectl describe deployment/solar-system -n ${{ vars.NAMESPACE }} && kubectl get pods -n ${{ vars.NAMESPACE }} && exit 1)
            
            # २. पोर्ट फॉरवर्डिंग
            kubectl port-forward svc/solar-system -n ${{ vars.NAMESPACE }} 3000:3000 --address 0.0.0.0 &
            sleep 10

        - name: Run Integration Tests
          run: |
            echo "Testing the application using localhost:3000"
            
            # १. curl वापरून डेटा मिळवणे आणि jq वापरून 'status' तपासणे
            RESPONSE=$(curl -s http://localhost:3000/live)
            STATUS=$(echo $RESPONSE | jq -r '.status')
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/live)

            echo "Response Status: $STATUS"
            echo "HTTP Code: $HTTP_CODE"

            # २. कंडिशन चेक करणे
            if [ "$HTTP_CODE" -eq 200 ] && [ "$STATUS" == "live" ]; then
                echo "Integration test passed successfully!"
            else
                echo "Integration test failed!"
                exit 1
            fi